# Turbo Pist önizleme: ana repodaki (turbo-pist) 'altyapi' dalının KAYNAK dosyasında
# yazan commit'ini derler ve bu reponun GitHub Pages adresine yayınlar.
# Hiçbir secret/token kullanılmaz: ana repo herkese açık, sadece okunur.
name: onizleme

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Bu repo (KAYNAK dosyası için)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Kaynak commit'i oku
        id: src
        run: echo "sha=$(tr -d '[:space:]' < KAYNAK)" >> "$GITHUB_OUTPUT"

      - name: Oyun kodunu çek (turbo-pist @ KAYNAK)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 53mehmetozdemir-maker/turbo-pist
          ref: ${{ steps.src.outputs.sha }}
          path: oyun
          persist-credentials: false

      - name: Node
        if: hashFiles('oyun/package.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12.0'

      - name: Derle (Vite varsa) ya da olduğu gibi kopyala
        working-directory: oyun
        run: |
          set -euo pipefail
          if [ -f package.json ] && grep -q '"build"' package.json; then
            npm ci --no-audit --no-fund
            # önizleme canlıyla aynı alan adında: kendi localStorage anahtarlarına yazsın
            VITE_DEPO_ONEK=onizleme_ VITE_SURUM="${{ steps.src.outputs.sha }}" npm run build -- --base=/turbo-pist-onizleme/
            mv dist ../site
          else
            mkdir ../site
            rsync -a --exclude .git --exclude .github --exclude tests ./ ../site/
          fi
          echo "${{ steps.src.outputs.sha }}" > ../site/surum.txt

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
