# Turbo Pist önizleme: ana repodaki (turbo-pist) 'altyapi' dalının KAYNAK dosyasında
# yazan commit'ini derler ve bu reponun GitHub Pages adresine yayınlar.
# Önce o commit'in altın testleri koşar (turbo-pist/.github/workflows/testler.yml); biri kırmızıysa yayın durur.
# Hiçbir secret/token kullanılmaz: ana repo herkese açık, sadece okunur.
name: onizleme

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  kaynak:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.src.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: src
        run: |
          sha=$(tr -d '[:space:]' < KAYNAK)
          echo "$sha" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::KAYNAK tam bir commit kimliği (40 karakter) olmalı"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  testler:
    needs: kaynak
    uses: 53mehmetozdemir-maker/turbo-pist/.github/workflows/testler.yml@main
    with:
      ref: ${{ needs.kaynak.outputs.sha }}

  build:
    needs: [kaynak, testler]
    runs-on: ubuntu-24.04
    steps:
      - name: Bu repo (KAYNAK dosyası için)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Kaynak commit'i (testlerden geçen)
        id: src
        run: echo "sha=${{ needs.kaynak.outputs.sha }}" >> "$GITHUB_OUTPUT"

      - name: Oyun kodunu çek (turbo-pist @ KAYNAK)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 53mehmetozdemir-maker/turbo-pist
          ref: ${{ steps.src.outputs.sha }}
          path: oyun
          persist-credentials: false

      - name: TURN aracısını doğrula (Worker → Metered)
        # Oyun sitesi gibi istek atar. Loga sadece durum, X-TP-Kaynak ve sunucu adresleri yazılır;
        # TURN kullanıcı adı/parolası yazılmaz (loglar herkese açık).
        run: |
          set -euo pipefail
          curl -sS -m 20 -D baslik.txt -o ice.json -H "Origin: https://53mehmetozdemir-maker.github.io" https://turbo-pist-turn.53mehmetozdemir.workers.dev/ice
          head -1 baslik.txt
          grep -i '^x-tp-kaynak' baslik.txt || echo "X-TP-Kaynak: (yok)"
          grep -i '^access-control-allow-origin' baslik.txt || true
          python3 - <<'PY'
          import json
          l = json.load(open('ice.json'))
          turn = [s for s in l if any(str(u).startswith(('turn:', 'turns:')) for u in (s['urls'] if isinstance(s['urls'], list) else [s['urls']]))]
          print(f"{len(l)} ICE sunucusu, {len(turn)} TURN, kimlik bilgili: {sum(1 for s in turn if s.get('username') and s.get('credential'))}")
          for s in l: print('  ', s['urls'])
          PY
          rm -f ice.json baslik.txt
          # başka köken reddedilmeli
          kod=$(curl -s -o /dev/null -w '%{http_code}' -m 20 -H "Origin: https://kotu.example" https://turbo-pist-turn.53mehmetozdemir.workers.dev/ice)
          echo "başka köken: $kod"; test "$kod" = 403

      - name: Node
        if: hashFiles('oyun/package.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12.0'

      - name: Derle (Vite varsa) ya da olduğu gibi kopyala
        working-directory: oyun
        run: |
          set -euo pipefail
          if [ -f package.json ] && grep -q '"build"' package.json; then
            npm ci --no-audit --no-fund
            # önizleme canlıyla aynı alan adında: kendi localStorage anahtarlarına yazsın, ayrı odalarda oynasın
            # VITE_TURN_URL: Worker adresi (gizli değil; boşken sadece STUN)
            VITE_DEPO_ONEK=onizleme_ VITE_ODA_ONEK=onizleme- VITE_TURN_URL="https://turbo-pist-turn.53mehmetozdemir.workers.dev/ice" VITE_SURUM="${{ steps.src.outputs.sha }}" npm run build -- --base=/turbo-pist-onizleme/
            mv dist ../site
          else
            mkdir ../site
            rsync -a --exclude .git --exclude .github --exclude tests ./ ../site/
          fi
          echo "${{ steps.src.outputs.sha }}" > ../site/surum.txt

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
